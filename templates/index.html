<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibrit Haber Doğrulama Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 25px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; color: #34495e; }
        input[type="text"], textarea { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; background-color: #2e7d32; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #1b5e20; }
        .error { background-color: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
        .result-box { margin-top: 30px; border-top: 2px solid #f1f2f6; padding-top: 25px; }
        .decision { text-align: center; font-size: 20px; font-weight: 800; padding: 15px; border-radius: 8px; background-color: #fff8e1; color: #b78103; margin-bottom: 20px; border: 1px solid #ffe082; }
        .bar-container { background-color: #e0e0e0; border-radius: 8px; height: 24px; width: 100%; margin-bottom: 15px; position: relative; overflow: hidden; }
        .bar { height: 100%; border-radius: 8px; text-align: right; padding-right: 10px; line-height: 24px; color: white; font-weight: bold; font-size: 13px; transition: width 0.5s ease-in-out; }
        .bar.ai { background-color: #42a5f5; }
        .bar.api { background-color: #26a69a; }
        .bar.final { background-color: #795548; font-size: 22px; height: 50px; line-height: 50px; text-align: center; padding-right: 0; }
        .final-wrapper { margin-top: 25px; text-align: center; }
        .source-tag { display: inline-block; background-color: #37474f; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Hibrit Haber Doğrulama Sistemi</h1>

    {% if error %}
        <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form action="/" method="POST">
        <label for="title">Haber Başlığı:</label>
        <input type="text" id="title" name="title" value="{{ baslik if baslik else '' }}" placeholder="Analiz edilecek haber başlığını girin..." required>

        <label for="content">Haber Detayı / İçeriği (Opsiyonel):</label>
        <textarea id="content" name="content" placeholder="Eğer varsa haberin detay metnini buraya yapıştırın...">{{ detay if detay else '' }}</textarea>

        <button type="submit">Sistemi Çalıştır ve Analiz Et 🚀</button>
    </form>

    {% if sonuc %}
        <div class="result-box">
            <div class="decision">📋 SİSTEM KARARI: {{ karar }}</div>
            
            <label>🤖 Yapay Zeka Üslup ve Semantik Skoru (NLP %50): %{{ model_skoru }}</label>
            <div class="bar-container">
                <div class="bar ai" style="width: {{ model_skoru }}%;">%{{ model_skoru }}</div>
            </div>

            <label>🌐 Canlı Medya ve Otorite Kanıt Skoru (API/Scraping %50): %{{ api_skoru }}</label>
            <div class="bar-container">
                <div class="bar api" style="width: {{ api_skoru }}%;">%{{ api_skoru }}</div>
            </div>

            <div class="final-wrapper">
                <label>🏁 HİBRİT HESAPLANAN NİHAİ DOĞRULUK ORANI</label>
                <div style="font-size: 48px; font-weight: 900; color: #3e2723; margin: 10px 0;">%{{ final_skor }}</div>
                <div class="source-tag">Veri İşleme Tipi: {{ kaynak }}</div>
            </div>
        </div>
    {% endif %}
</div>

</body>
</html>
